
<script type="text/javascript" template-section="onCompose">
    node
        .addDefault("name", { value:"Counter Example", required:true})
        .setIcon("prometheus.png")
        .setPaletteLabel("Counter Metric")
        .setLabelStyle("node_label_white")
        .setLabel(function() {return this.name })
        .setColor("#E75127")
        .setInput("input")
        .addOutputs("passthrough")
</script>

<script type="text/html" template-section="onIncludeEditForm">
    <div class="form-row">
        <label class="towb_editorlabel" for="node-input-name"><i class="fa fa-font"></i> Name</label>
        <input type="text" id="node-input-name" />
    </div>
</script>


<script type="text/markdown" template-section="onIncludeDocumentation">
Increments a Prometheus counter by 1 each time a message is received. The current counter value is displayed on the node status.

### Inputs
: *msg* (object) : any Node-RED message. The payload is not read; the counter is always incremented by 1.

### Outputs
: *msg* (object) : the original message, passed through unchanged.
</script>
