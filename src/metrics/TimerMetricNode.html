

<script type="text/javascript" template-section="onCompose">
    node
        .addDefault("name", { value:"Timer Example", required:true})
        .addDefault("timerFunction", { value:"Start", required:true})
        .addDefault("timerShowStatus", { value:"None", required:true})
        .addDefault("timerKey", { value:"", required:false})
        .addDefault("timerObserveProperty", { value:"payload", required:false})
        .setIcon("timer.png")
        .setPaletteLabel("Timer Metric")
        .setLabelStyle("node_label_white")
        .setLabel(function() {return this.name })
        .setColor("#E75127")
        .setInput("input")
        .addOutputs("passthrough")
</script>

<script type="text/javascript" template-section="onIncludeEditPrepare">
    let node = this;

    let timerFunctionSelection = $("#node-input-timerFunction");
    timerFunctionSelection.typedInput({type:"timerFunction", types:[{
        value: "timerFunction",
        options: [
            { value: "Start", label: "Start"},
            { value: "Stop", label: "Stop"},
            { value: "Observe", label: "Observe"}
        ]
    }]});

    let timerShowStatusSelection = $("#node-input-timerShowStatus");
    timerShowStatusSelection.typedInput({type:"timerShowStatus", types:[{
        value: "timerShowStatus",
        options: [
            { value: "None", label: "None"},
            { value: "Average", label: "Average"},
        ]
    }]});

    let observePropertyInput = $("#node-input-timerObserveProperty");
    observePropertyInput.typedInput({ type: "msg", types: ["msg"] });

    let _isTimerStart = false;
    function updateTimerFunctionVisibility(val) {
        _isTimerStart = (val === "Start");
        let isObserve = (val === "Observe");
        let isStartOrStop = (val === "Start" || val === "Stop");
        $("#section_timerkey").toggle(isStartOrStop);
        $("#section_timermetricconfig").toggle(!_isTimerStart);
        $("#section_configfragment").toggle(!_isTimerStart);
        $("#section_timershowstatus").toggle(!_isTimerStart);
        $("#section_timerobserveproperty").toggle(isObserve);
    }
    timerFunctionSelection.on("change", function() {
        updateTimerFunctionVisibility(timerFunctionSelection.typedInput("value"));
    });
    updateTimerFunctionVisibility(node.timerFunction || "Start");

    // Re-apply after async template init (provider fetch, fragment load)
    let metricObs = new MutationObserver(function() {
        if (_isTimerStart) {
            $("#section_timermetricconfig").hide();
            $("#section_configfragment").hide();
        }
    });
    let timerSection = document.getElementById("section_timermetricconfig");
    let fragmentSection = document.getElementById("section_configfragment");
    if (timerSection) metricObs.observe(timerSection, { attributes: true, attributeFilter: ["style"] });
    if (fragmentSection) metricObs.observe(fragmentSection, { attributes: true, attributeFilter: ["style"] });
</script>

<script type="text/javascript" template-section="onIncludeEditSave">
    let _thisId = this.id;
    let timerFunc = this.timerFunction;
    if (timerFunc === "Start" || timerFunc === "Stop") {
        let thisKey = this.timerKey || this.name;
        let counterpart = (timerFunc === "Start") ? "Stop" : "Start";
        let found = false;
        RED.nodes.eachNode(function(n) {
            if (n.type === "TimerMetricNode" && n.id !== _thisId) {
                let nFunc = n.timerFunction;
                let nKey = n.timerKey || n.name;
                if (nFunc === counterpart && nKey === thisKey) {
                    found = true;
                }
            }
        });
        if (!found && thisKey) {
            RED.notify(
                "Timer key <strong>" + RED.utils.sanitize(thisKey) + "</strong>: no matching <strong>" + counterpart + "</strong> timer found.",
                { type: "warning", timeout: 5000 }
            );
        }
    }
</script>

<script type="text/html" template-section="onIncludeEditForm">
    <div class="form-row">
        <label class="towb_editorlabel" for="node-input-name"><i class="fa fa-font"></i> Name</label>
        <input class="towb_editorfield" type="text" id="node-input-name" />
    </div>

    <div class="form-row">
        <label class="towb_editorlabel" for="node-input-timerFunction"><i class="fa fa-cogs"></i> Function</label>
        <input class="towb_editorfield" type="text" id="node-input-timerFunction" />
    </div>

    <div id="section_timerkey" class="form-row" style="display:none;">
        <label class="towb_editorlabel" for="node-input-timerKey"><i class="fa fa-key"></i> Timer Key</label>
        <input class="towb_editorfield" type="text" id="node-input-timerKey" placeholder="Leave empty to use node name" />
    </div>

    <div id="section_timerobserveproperty" class="form-row" style="display:none;">
        <label class="towb_editorlabel" for="node-input-timerObserveProperty"><i class="fa fa-crosshairs"></i> Value</label>
        <input class="towb_editorfield" type="text" id="node-input-timerObserveProperty" />
    </div>

    <div id="section_timershowstatus" class="form-row">
        <label class="towb_editorlabel" for="node-input-timerShowStatus"><i class="fa fa-eye"></i> Show Status</label>
        <input class="towb_editorfield" type="text" id="node-input-timerShowStatus" />
    </div>
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
Records timing observations to a histogram or summary. Three nodes are typically chained in a flow - one set to **Start**, one to **Stop** - to measure the duration of operations across multiple steps.

### Inputs
: *msg* (object) : any Node-RED message. Depending on the function, the node reads or writes a value on `msg._timer`.

### Outputs
: *msg* (object) : the original message, with `msg._timer` updated if the function is **Start**.

### Properties
: *function* (select) : the operation this node performs when a message arrives.
- **Start** - records the current timestamp (in milliseconds) into `msg._timer` and passes the message on.
- **Stop** - reads the timestamp stored by a preceding Start node from `msg._timer`, calculates the elapsed time in milliseconds, and records the observation. If no timestamp is found the message is still passed through with no observation recorded.
- **Observe** - reads a value from the configured message property (default `msg.payload`) and records it as an observation directly. Useful when the elapsed time is calculated externally.

: *timer key* (string) : a shared key that pairs a **Start** node with its **Stop** node. Both nodes must use the same key. Defaults to the node name if left empty.

: *value* (msg property) : only shown for **Observe**. The message property to read the observation value from (default `msg.payload`).

: *show status* (select) : controls what is displayed on the node in the flow canvas.
- **None** - no status is displayed.
- **Average** - displays the running average of all observations in milliseconds.
</script>
